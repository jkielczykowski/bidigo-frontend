name: Deploy

# Web app pipeline (FluffyTag-style; secrets in .github/SECRETS.md). Every push to main:
# build + lint → deploy to the test server → smoke. A manual run can pick another target
# (deploy/targets/<target>.env + the GitHub environment of the same name with its own secrets).
# The full E2E suite from bidigo-backend against THIS web build runs on pull requests and on a
# manual run with e2e=true.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the full E2E suite before deploying
        type: boolean
        default: false
      target:
        description: Where to deploy (deploy/targets/<target>.env + GitHub environment)
        type: choice
        options: [test, production]
        default: test

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target || 'test' }}
  BACKEND_REPO: jkielczykowski/bidigo-backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, build
        run: |
          npx tsc -b
          npm run lint
          npm run build

  e2e:
    needs: build
    # Off on pushes for faster deploys; runs on pull requests or a manual run with e2e=true
    if: github.event_name == 'pull_request' || inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout web app
        uses: actions/checkout@v4
        with:
          path: frontend

      # The E2E suite, migrations and local stack live in the (private) backend repo;
      # read through a read-only deploy key of bidigo-backend (scripts/backend-deploy-key.sh)
      - name: Checkout bidigo-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend/e2e

      - name: Install Playwright browsers
        working-directory: backend/e2e
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase and load migrations
        working-directory: backend/e2e
        run: |
          npm run db:start
          node scripts/db-load.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start local OpenSearch + bidigo-search
        working-directory: backend/e2e
        run: npm run search:start

      - name: Start bidigo-api (Java) against the local stack
        working-directory: backend/e2e
        run: npm run api:start

      - name: Run E2E tests against this web build
        working-directory: backend/e2e
        env:
          CI: true
          FRONTEND_DIR: ${{ github.workspace }}/frontend
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/e2e/report/
          retention-days: 7

  deploy:
    environment: ${{ inputs.target || 'test' }}
    needs: [build, e2e]
    # Runs when E2E passed or was skipped, never when it failed
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.e2e.result) && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/bidigo-deploy
          chmod 600 ~/.ssh/bidigo-deploy

      - name: Deploy web app to VPS
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: SSH_KEY="$HOME/.ssh/bidigo-deploy" bash deploy/deploy.sh

  smoke:
    environment: ${{ inputs.target || 'test' }}
    needs: deploy
    # Explicit, or a skipped e2e further up would skip this job too
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    # Browsers and their system packages are in the image (installing them via apt sometimes took 10 min);
    # keep the tag equal to @playwright/test in smoke/package-lock.json
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smoke/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix smoke

      - name: Read the target's public URL
        run: |
          . "deploy/targets/${TARGET}.env"
          echo "SMOKE_BASE_URL=${PUBLIC_URL}" >> "$GITHUB_ENV"

      - name: Run smoke tests against the deployed site
        working-directory: smoke
        env:
          CI: true
        run: npm test

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: smoke/report/
          retention-days: 7
